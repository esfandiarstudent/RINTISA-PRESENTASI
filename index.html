const QB = [
  // Frontend
  {id:'fe1',track:'frontend',comp:'Dasar React',d:1,q:'Apa fungsi prop key saat merender daftar elemen dengan map() di React?',o:['Memberi gaya CSS unik pada tiap item','Membantu React mengenali item yang berubah, bertambah, atau terhapus','Menyimpan state lokal tiap item','Wajib diisi di setiap komponen, bukan hanya daftar'],a:1,why:'key memberi identitas stabil pada tiap item sehingga React bisa memperbarui DOM secara efisien. Hindari memakai index jika urutan item bisa berubah.'},
  {id:'fe2',track:'frontend',comp:'Dasar React',d:1,q:'Pernyataan yang benar tentang props dan state adalah…',o:['Props boleh diubah langsung oleh komponen penerima','Props dikirim dari induk dan bersifat read-only, state dikelola komponen itu sendiri','State hanya bisa dipakai di class component','Props dan state sama saja, hanya beda nama'],a:1,why:'Props mengalir satu arah dari induk dan tidak boleh dimutasi. State adalah data internal komponen yang perubahannya memicu render ulang.'},
  {id:'fe3',track:'frontend',comp:'State Management',d:2,q:'Setelah handleClick dipanggil sekali, berapa nilai count pada render berikutnya?',code:'const [count, setCount] = useState(0);\n\nfunction handleClick() {\n  setCount(count + 1);\n  setCount(count + 1);\n  setCount(count + 1);\n}',o:['3','1','0','Terjadi error'],a:1,why:'Ketiga pemanggilan membaca nilai count yang sama (0) dari render saat ini, jadi hasilnya 1. Gunakan updater setCount(c => c + 1) jika ingin bertambah 3.'},

  {id:'fe5',track:'frontend',comp:'Async & API',d:2,q:'Apa masalah utama dari kode berikut?',code:"useEffect(() => {\n  fetch('/api/produk')\n    .then(r => r.json())\n    .then(setProduk);\n});",o:['Tidak ada masalah, fetch hanya berjalan sekali','Tanpa dependency array, efek berjalan setiap render sehingga setProduk memicu request berulang','fetch tidak boleh dipakai di dalam useEffect','setProduk harus dipanggil sebelum fetch'],a:1,why:'Tambahkan [] agar efek hanya berjalan saat komponen dipasang. Tanpa itu, setiap setProduk memicu render baru yang menjalankan efek lagi.'},
  {id:'fe6',track:'frontend',comp:'Async & API',d:3,q:'Kolom pencarian memanggil API di setiap ketikan. Kadang hasil untuk kata lama muncul menimpa hasil kata terbaru. Solusi paling tepat?',o:['Menambahkan setTimeout 1 detik sebelum menampilkan hasil','Debounce input dan batalkan request lama dengan AbortController','Mengganti ke class component','Memanggil API dua kali agar hasilnya pasti terbaru'],a:1,why:'Debounce mengurangi jumlah request, dan AbortController mencegah respons lama yang datang terlambat menimpa state (race condition).'},

/* ---------- 6. "AI" simulasi ----------
   [PRODUKSI] detectTrack & analyzeNeed diganti panggilan LLM di backend dengan output JSON terstruktur.
   scoreCand tetap deterministik di backend agar skor bisa diaudit. */
function detectTrack(text) {
  const t = (text || '').toLowerCase(); let best = null;
  for (const [k, tr] of Object.entries(TRACKS)) {
    const n = tr.kw.filter(w => has(t, w)).length + (has(t, tr.name.toLowerCase()) ? 2 : 0);
    if (n && (!best || n > best.n)) best = { key:k, n };
  }
  if (best) best.conf = Math.min(.98, .72 + .09 * best.n);
  return best;
}
const tagsFrom = text => TAG_KEYS.filter(k => TAGS[k].kw.some(w => has(text, w)));

function analyzeNeed() {
  const t = D.desc.toLowerCase();
  let tags = tagsFrom(t).filter(x => !D.rm.includes(x));
  D.add.forEach(x => { if (!tags.includes(x)) tags.push(x); });
  const kws = [...new Set(TAG_KEYS.flatMap(k => TAGS[k].kw).filter(w => has(t, w)))];
  const votes = {};
  tags.forEach(g => { const tr = TAGS[g].t; votes[tr] = (votes[tr] || 0) + 1; });
  const dt = detectTrack(t); if (dt) votes[dt.key] = (votes[dt.key] || 0) + .5;
  const track = D.manualTrack || Object.keys(votes).sort((a, b) => votes[b] - votes[a])[0] || null;
  const urgent = D.days <= 3 || ['segera','cepat','besok','mendesak','urgent','hari ini'].some(w => has(t, w));
  const complexity = tags.length >= 5 ? 'Tinggi' : (tags.length >= 3 || t.length > 180) ? 'Menengah' : 'Ringan';
  const conf = track ? Math.min(.96, (D.manualTrack ? .9 : .5) + .11 * tags.length) : 0;
  return { track, tags, kws, urgent, complexity, conf, fee: track ? FEE[track] : null };
}

// Match Score = 0.40·skill + 0.35·asesmen + 0.15·budget + 0.10·reliabilitas
const W = { skill:.40, assess:.35, budget:.15, rel:.10 };
function scoreCand(c, need) {
  const req = need.tags, have = req.filter(t => c.tags.includes(t)), miss = req.filter(t => !c.tags.includes(t));
  const tf = c.track === need.track ? 1 : (c.tracks || []).includes(need.track) ? .6 : 0;
  const skill = req.length ? .5 * tf + .5 * (have.length / req.length) : tf;
  const assess = c.assessment.score / 100 * (tf ? 1 : .5);        // asesmen di jalur lain hanya dihitung separuh
  const budget = c.rate <= D.budget ? 1 : Math.max(0, 1 - (c.rate - D.budget) / D.budget);
  const rel = (c.onTime == null ? .75 : c.onTime / 100) * .6 + (c.available ? .4 : need.urgent ? .05 : .2);
  const total = Math.round(100 * (W.skill * skill + W.assess * assess + W.budget * budget + W.rel * rel));
  const why = [], warn = [];
  if (tf === 1) why.push(`Lulus asesmen ${TRACKS[c.track].name} dengan skor ${c.assessment.score} (${c.assessment.level}).`);
  else if (tf) why.push(`Punya keahlian sekunder di ${TRACKS[need.track].name}.`);
  if (have.length) why.push(`Menguasai ${have.length} dari ${req.length} kemampuan yang dibutuhkan: ${have.join(', ')}.`);
  if (c.rate <= D.budget) why.push(`Tarif ${rp(c.rate)} masuk dalam budget.`);
  else warn.push(`Tarif minimum ${rp(c.rate)} di atas budget ${rp(D.budget)}.`);
  if (!c.available) warn.push(need.urgent ? `Belum tersedia (${c.availability}), padahal kebutuhanmu mendesak.` : `Belum tersedia minggu ini (${c.availability}).`);
  if (miss.length && have.length) warn.push(`Belum menandai kemampuan: ${miss.join(', ')}.`);
  return { c, skill, assess, budget, rel, total, have, miss, why, warn };
}

function startGenerate() {
  if (!A.name.trim()) return toast('Isi nama lengkap dulu.');
  if (!(A.rate >= 25000)) return toast('Tarif minimum paling sedikit Rp 25.000.');
  const d = detectTrack(A.skill);
  if (!d) return toast('Keahlian belum dikenali. Pilih salah satu jalur yang tersedia.');
  const tr = TRACKS[d.key], pool = QB.filter(q => q.track === d.key).length;
  Object.assign(A, { track:d.key, conf:d.conf, step:2, gen:[], gi:0, genDone:false, asked:[], seen:[], answers:[], result:null, sel:null, diff:CLAIMS.indexOf(A.claim) + 1, showJson:false });
  A.lines = [`Menganalisis input "${A.skill}"`, `Jalur terdeteksi: ${tr.name} (keyakinan ${A.conf.toFixed(2)})`, `Memetakan ${tr.comps.length} kompetensi: ${tr.comps.join(', ')}`,
             `Level awal dari klaim pengalaman: ${DIFF[A.diff]}`, `Menyusun ${TEST_LEN} soal adaptif dari bank ${pool} item`, `Mengacak urutan pilihan jawaban`, `Blueprint asesmen siap`];
  render(); scrollTo(0, 0);
}
function genTick() {
  T.gen = null;
  if (route() !== 'onboarding' || A.step !== 2 || A.genDone) return;
  A.gen.push(A.lines[A.gi++]);
  const el = $('#genlog'); if (el) el.innerHTML = genLogHTML();
  if (A.gi < A.lines.length) T.gen = setTimeout(genTick, 480);
  else { A.genDone = true; T.gen = setTimeout(() => { T.gen = null; if (route() === 'onboarding') render(); }, 350); }
}
const genLogHTML = () => A.gen.map(l => `<div class="fade-up"><span class="text-emerald-400">›</span> ${esc(l)}</div>`).join('') + (A.genDone ? '' : '<div class="caret text-slate-500">&nbsp;</div>');

function obGenerate() {
  const tr = TRACKS[A.track];
  return `<section class="${CARD} p-6">

      <p class="mt-5 text-sm font-semibold text-navy-900">Kompetensi yang diuji</p>
      <div class="mt-2 flex flex-wrap gap-2">${tr.comps.map(c => `<span class="rounded-full bg-navy-50 px-3 py-1 text-xs font-semibold text-navy-700">${c}</span>`).join('')}</div>
      <ul class="mt-5 space-y-2 text-sm text-slate-600">${['Soal muncul satu per satu dan jawaban tidak bisa diubah.', 'Jawaban benar menaikkan tingkat kesulitan, jawaban salah menurunkannya.', 'Waktu habis dihitung sebagai jawaban kosong.'].map(checkLi).join('')}</ul>

    </div>` : ''}

function startTest() { A.step = 3; A.t0 = Date.now(); nextQ(); render(); scrollTo(0, 0); }
function nextQ() { // pilih soal terdekat dengan level saat ini, utamakan kompetensi yang belum diuji
  const cov = new Set(A.answers.map(a => a.comp));
  const pool = QB.filter(q => q.track === A.track && !A.asked.includes(q.id))
    .map(q => [q, Math.abs(q.d - A.diff) * 2 + (cov.has(q.comp) ? 1 : 0) + (A.seen.includes(q.id) ? 3 : 0) + Math.random() * .6])
    .sort((a, b) => a[1] - b[1]);
  A.cur = pool[0][0]; A.asked.push(A.cur.id); A.order = shuffle([0, 1, 2, 3]); A.sel = null; A.left = QTIME; A.qStart = Date.now();
  startTimer();
}
function startTimer() {
  clearInterval(T.q);
  T.q = setInterval(() => {
    if (route() !== 'onboarding' || A.step !== 3) { stopTimer(); return; }
    A.left = Math.max(0, A.left - 1);
    const t = $('#tmr'), b = $('#tbar');
    if (t) t.textContent = A.left + ' dtk';
    if (b) { b.style.width = (A.left / QTIME * 100) + '%'; b.style.backgroundColor = A.left <= 10 ? '#D97706' : ''; }
    if (A.left <= 0) submitAns(true);
  }, 1000);
}
function stopTimer() { clearInterval(T.q); T.q = null; clearTimeout(T.gen); T.gen = null; }

function submitAns(timeout) {
  if (!timeout && A.sel == null) return;
  clearInterval(T.q); T.q = null;
  const q = A.cur, chosen = timeout ? null : A.sel, ok = chosen === q.a;
  A.answers.push({ id:q.id, comp:q.comp, d:q.d, chosen, ok, secs:Math.round((Date.now() - A.qStart) / 1000), timeout:!!timeout });
  A.diff = ok ? Math.min(3, q.d + 1) : Math.max(1, q.d - 1);
  if (A.answers.length >= TEST_LEN) finish(); else nextQ();
  render();
  if (timeout) toast('Waktu habis, soal dihitung kosong.');
}
const levelOf = s => s >= 88 ? 'Mahir' : s >= 75 ? 'Menengah' : s >= PASS ? 'Pemula' : 'Belum lolos';
function finish() {
  stopTimer();
  const ans = A.answers, earned = ans.reduce((s, a) => s + (a.ok ? a.d : 0), 0), tot = ans.reduce((s, a) => s + a.d, 0);
  const score = Math.round(earned / tot * 100), comps = {};
  ans.forEach(a => { comps[a.comp] = comps[a.comp] || { n:0, ok:0 }; comps[a.comp].n++; if (a.ok) comps[a.comp].ok++; });
  const compPct = Object.fromEntries(Object.entries(comps).map(([k, v]) => [k, Math.round(v.ok / v.n * 100)]));
  A.result = { score, level:levelOf(score), passed:score >= PASS, compPct, earned, tot, correct:ans.filter(a => a.ok).length,
               secs:Math.round((Date.now() - A.t0) / 1000), session:'as_' + Date.now().toString(36), date:new Date().toISOString() };
  A.step = 4;
  if (A.result.passed) saveYou();
}
function saveYou() {

  const you = { id:'tal_you', isYou:true, name:A.name.trim(), city:A.city.trim() || 'Indonesia', track:A.track, tracks:[A.track], tags,
    rate:A.rate, available:true, availability:'Tersedia', projects:0, onTime:null, av:1,
    assessment:{ score:r.score, level:r.level, session:r.session, date:r.date, comps:r.compPct } };
  CANDS = [you, ...CANDS.filter(c => !c.isYou)];
  try { localStorage.setItem(LS, JSON.stringify(you)); } catch (e) {}
}

function setManual(k) { D.manualTrack = k; D.need = analyzeNeed(); renderResults(); }
function rmTag(i) { const k = TAG_KEYS[i]; D.add = D.add.filter(x => x !== k); if (!D.rm.includes(k)) D.rm.push(k); D.need = analyzeNeed(); renderResults(); }
function addTag(v) { if (v === '') return; const k = TAG_KEYS[+v]; D.rm = D.rm.filter(x => x !== k); if (!D.add.includes(k)) D.add.push(k); D.need = analyzeNeed(); renderResults(); }

function resultsHTML() {
  if (D.loading) return `<div class="space-y-4"><div class="${CARD} flex items-center gap-3 p-5"><span class="grid h-10 w-10 animate-pulse place-items-center rounded-xl bg-emerald-50 text-emerald-700">${ic('sparkles')}</span><div><p class="font-bold text-navy-950">AI menganalisis kebutuhanmu…</p><p class="text-sm text-slate-500">Mengekstrak kemampuan, menilai urgensi, lalu menghitung skor ${CANDS.length} talenta.</p></div></div>${[0, 1, 2].map(() => `<div class="${CARD} p-5"><div class="flex gap-4"><div class="shimmer h-12 w-12 rounded-xl"></div><div class="flex-1 space-y-2"><div class="shimmer h-4 w-1/3 rounded"></div><div class="shimmer h-3 w-1/2 rounded"></div></div><div class="shimmer h-16 w-16 rounded-full"></div></div><div class="shimmer mt-4 h-20 rounded-xl"></div></div>`).join('')}</div>`;
  if (!D.need) return `<div class="grid place-items-center rounded-2xl border border-dashed border-slate-300 bg-white/60 px-6 py-16 text-center">
      <div class="relative h-24 w-40" aria-hidden="true"><div class="absolute left-2 top-4 h-16 w-28 -rotate-6 rounded-xl border border-slate-200 bg-white shadow-soft"></div><div class="absolute right-2 top-0 flex h-16 w-28 rotate-3 items-center gap-2 rounded-xl border border-slate-200 bg-white px-3 shadow-lift"><div class="h-7 w-7 rounded-lg bg-emerald-100"></div><div class="flex-1 space-y-1.5"><div class="h-1.5 rounded bg-slate-200"></div><div class="h-1.5 w-2/3 rounded bg-slate-200"></div></div></div><div class="absolute bottom-0 right-8 grid h-10 w-10 place-items-center rounded-full bg-navy-900 text-xs font-bold text-white">92</div></div>
      <h2 class="mt-6 text-lg font-bold text-navy-950">Hasil kecocokan muncul di sini</h2><p class="mt-1 max-w-sm text-sm text-slate-500">Tulis masalahmu di panel kiri, atau coba salah satu contoh untuk melihat cara AI mengurutkan ${CANDS.length} talenta terverifikasi.</p>
      <button onclick="useEx(0)" class="${btn('out','sm')} mt-5">Coba contoh: landing page toko kue</button></div>`;
  const need = D.need;
  if (!need.track) return `<div class="rounded-2xl border border-amber-200 bg-amber-50 p-5"><div class="flex gap-3"><span class="shrink-0 text-amber-600">${ic('alert')}</span><div><p class="font-bold text-amber-900">AI belum bisa memetakan kebutuhan ini</p><p class="mt-1 text-sm text-amber-800">Sebutkan jenis hasil yang kamu harapkan (misalnya website, logo, video, laporan Excel), atau pilih kategori secara manual.</p><div class="mt-3 flex flex-wrap gap-2">${Object.entries(TRACKS).map(([k, t]) => `<button onclick="setManual('${k}')" class="inline-flex items-center gap-1.5 rounded-full border border-amber-300 bg-white px-3 py-1.5 text-xs font-semibold text-amber-900 hover:bg-amber-100">${ic(t.icon,'h-3.5 w-3.5')}${t.name}</button>`).join('')}</div></div></div></div>`;

  const all = CANDS.map(c => scoreCand(c, need));
  const rel = all.filter(r => r.skill >= .35), low = all.filter(r => r.skill < .35);
  const list = rel.filter(r => r.c.assessment.score >= D.minScore && (!D.onlyAvail || r.c.available));
  list.sort(D.sort === 'assess' ? (a, b) => b.c.assessment.score - a.c.assessment.score : D.sort === 'rate' ? (a, b) => a.c.rate - b.c.rate : (a, b) => b.total - a.total);
  const hidden = rel.length - list.length, tr = TRACKS[need.track];

  return `<div class="${CARD} p-5 fade-up">
      <div class="flex items-start justify-between gap-3"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-50 text-emerald-700">${ic(tr.icon)}</span><div><p class="text-xs font-semibold uppercase tracking-wider text-slate-500">Pemahaman AI</p><p class="font-bold text-navy-950">${tr.name}</p></div></div><span class="rounded-full bg-slate-100 px-2.5 py-1 text-xs font-semibold text-slate-600">keyakinan ${Math.round(need.conf * 100)}%</span></div>
      <p class="mt-4 text-xs font-semibold text-slate-500">Kemampuan yang dibutuhkan <span class="font-normal">· kurang tepat? hapus atau tambahkan</span></p>
      <div class="mt-2 flex flex-wrap items-center gap-1.5">${need.tags.map(t => `<span class="inline-flex items-center gap-1 rounded-full bg-navy-900 py-1 pl-3 pr-1.5 text-xs font-semibold text-white">${esc(t)}<button onclick="rmTag(${TAG_KEYS.indexOf(t)})" class="grid h-4 w-4 place-items-center rounded-full hover:bg-white/20" aria-label="Hapus ${esc(t)}">${ic('x','h-3 w-3')}</button></span>`).join('')}
        <select onchange="addTag(this.value)" aria-label="Tambah kemampuan" class="rounded-full border border-dashed border-slate-300 bg-white px-2.5 py-1 text-xs font-semibold text-slate-600"><option value="">+ Tambah</option>${TAG_KEYS.map((k, i) => need.tags.includes(k) ? '' : `<option value="${i}">${esc(k)}</option>`).join('')}</select></div>
      <dl class="mt-4 grid gap-3 sm:grid-cols-3">${[['Kompleksitas', need.complexity], ['Urgensi', need.urgent ? 'Mendesak' : 'Normal'], ['Honor wajar', `${rp(need.fee[0])} – ${rp(need.fee[1])}`]].map(([l, v]) => `<div class="rounded-xl bg-slate-50 p-3"><dt class="text-xs text-slate-500">${l}</dt><dd class="mt-0.5 text-sm font-bold text-navy-950">${v}</dd></div>`).join('')}</dl>
      ${D.budget < need.fee[0] ? `<p class="mt-3 flex gap-2 rounded-xl bg-amber-50 p-3 text-sm text-amber-800"><span class="shrink-0 text-amber-600">${ic('alert','h-4 w-4')}</span>Budget ${rp(D.budget)} di bawah kisaran honor wajar untuk pekerjaan ini. Talenta berpengalaman mungkin menolak undangan.</p>` : ''}
    </div>
    <div class="mt-6 flex flex-wrap items-center justify-between gap-3"><h2 class="text-lg font-bold text-navy-950">${list.length} kandidat terverifikasi cocok</h2><button class="${btn('out','sm')}" onclick="D.json=!D.json;renderResults()">${ic('braces','h-4 w-4')} ${D.json ? 'Tutup' : 'Lihat'} data di balik layar</button></div>
    ${D.json ? `<div class="${CARD} mt-4 p-4 fade-up"><div class="flex flex-wrap items-center justify-between gap-2"><div class="inline-flex rounded-lg bg-slate-100 p-1 text-xs font-semibold" role="tablist">${[['req', 'Request'], ['res', 'Response']].map(([k, l]) => `<button role="tab" aria-selected="${D.jsonTab === k}" class="rounded-md px-3 py-1.5 ${D.jsonTab === k ? 'bg-white text-navy-900 shadow-sm' : 'text-slate-500'}" onclick="D.jsonTab='${k}';renderResults()">${l}</button>`).join('')}</div><span class="text-xs text-slate-500">Simulasi kontrak API <span class="font-mono">POST /api/v1/match</span></span></div>${jsonBox(D.jsonTab === 'req' ? matchReq() : matchRes(need, list))}</div>` : ''}
    <div class="mt-4 space-y-4">${list.length ? list.map(candCard).join('') : `<div class="${CARD} p-6 text-center text-sm text-slate-600">Tidak ada kandidat yang lolos filter. Turunkan skor minimum atau matikan "hanya yang tersedia".</div>`}</div>
    ${hidden ? `<p class="mt-4 text-center text-xs text-slate-500">${hidden} kandidat relevan disembunyikan oleh filter.</p>` : ''}
    ${low.length ? `<details class="mt-6 rounded-2xl border border-dashed border-slate-300 bg-white/60 p-4"><summary class="cursor-pointer text-sm font-semibold text-slate-600">Kurang relevan untuk kebutuhan ini (${low.length})</summary><ul class="mt-3 grid gap-2 sm:grid-cols-2">${low.sort((a, b) => b.total - a.total).map(r => `<li class="flex items-center justify-between rounded-lg bg-slate-50 px-3 py-2 text-sm"><span class="truncate">${esc(r.c.name)} <span class="text-xs text-slate-500">· ${TRACKS[r.c.track].name}</span></span><b class="tabular-nums text-slate-500">${r.total}</b></li>`).join('')}</ul></details>` : ''}`;
}

function candCard(r, i) {
  const c = r.c, s = r.total;
  const F = [['Kecocokan skill', r.skill, W.skill], ['Skor asesmen', r.assess, W.assess], ['Kesesuaian budget', r.budget, W.budget], ['Reliabilitas', r.rel, W.rel]];
  return `<article class="fade-up rounded-2xl border ${c.isYou ? 'border-emerald-300 ring-2 ring-emerald-100' : 'border-slate-200'} bg-white p-5 shadow-soft transition hover:shadow-lift" style="animation-delay:${i * 60}ms">
    <div class="flex items-start gap-4">
      ${avatar(c)}
      <div class="min-w-0 flex-1">
        <div class="flex flex-wrap items-center gap-2"><h3 class="font-bold text-navy-950">${esc(c.name)}</h3>${c.isYou ? '<span class="rounded-full bg-emerald-600 px-2 py-0.5 text-[11px] font-bold text-white">Kamu</span>' : ''}${i === 0 && D.sort === 'match' ? '<span class="rounded-full bg-navy-900 px-2 py-0.5 text-[11px] font-bold text-white">Paling cocok</span>' : ''}</div>
        <p class="mt-0.5 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-slate-500"><span>${TRACKS[c.track].name}</span><span class="inline-flex items-center gap-1">${ic('pin','h-3.5 w-3.5')}${esc(c.city)}</span><span><b class="text-navy-900">${rp(c.rate)}</b>/proyek</span></p>
        <div class="mt-2 flex flex-wrap gap-1.5">
          <span class="inline-flex items-center gap-1 rounded-full bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 ring-1 ring-emerald-200">${ic('shieldCheck','h-3.5 w-3.5')} Asesmen ${c.assessment.score} · ${c.assessment.level}</span>
          <span class="inline-flex items-center gap-1 rounded-full px-2.5 py-0.5 text-xs font-semibold ${c.available ? 'bg-sky-50 text-sky-700 ring-1 ring-sky-200' : 'bg-slate-100 text-slate-600'}">${ic('clock','h-3.5 w-3.5')}${esc(c.availability)}</span>
          <span class="rounded-full bg-slate-100 px-2.5 py-0.5 text-xs font-semibold text-slate-600">${c.projects ? `${c.projects} proyek · ${c.onTime}% tepat waktu` : 'Talenta baru'}</span>
        </div>
      </div>
      <div class="text-center">${ring(s, scoreCol(s))}<p class="mt-1 text-[11px] font-semibold uppercase tracking-wider text-slate-500">Match</p></div>
    </div>
    <div class="mt-4 flex flex-wrap gap-1.5">${c.tags.map(t => `<span class="rounded-md px-2 py-0.5 text-xs font-medium ${r.have.includes(t) ? 'bg-emerald-50 text-emerald-800 ring-1 ring-emerald-200' : 'bg-slate-100 text-slate-600'}">${esc(t)}</span>`).join('')}</div>
    <div class="mt-4 grid gap-x-6 gap-y-3 rounded-xl bg-slate-50 p-4 sm:grid-cols-2">${F.map(([l, v, w]) => `<div><div class="flex justify-between text-xs"><span class="font-semibold text-slate-600">${l} <span class="font-normal text-slate-400">× ${w.toFixed(2)}</span></span><span class="font-bold tabular-nums text-navy-900">${Math.round(v * 100)}</span></div><div class="mt-1.5">${bar(v * 100)}</div></div>`).join('')}</div>
    <ul class="mt-4 space-y-1.5 text-sm">${r.why.map(w => `<li class="flex gap-2 text-slate-600"><span class="mt-0.5 shrink-0 text-emerald-600">${ic('check','h-4 w-4')}</span>${esc(w)}</li>`).join('')}${r.warn.map(w => `<li class="flex gap-2 text-amber-800"><span class="mt-0.5 shrink-0 text-amber-600">${ic('alert','h-4 w-4')}</span>${esc(w)}</li>`).join('')}</ul>
    <div class="mt-5 flex flex-col gap-2 border-t border-slate-100 pt-4 sm:flex-row sm:justify-end"><button class="${btn('out','sm')}" onclick="showAssess('${c.id}')">${ic('eye','h-4 w-4')} Lihat hasil asesmen</button><button class="${btn('pri','sm')}" onclick="invite('${c.id}')">${ic('send','h-4 w-4')} Undang ke proyek</button></div>
  </article>`;
}

function matchReq() {
  return { endpoint:'POST /api/v1/match', client_id:'cli_demo_01', problem_statement:D.desc.trim(), budget_idr:D.budget, deadline_days:D.days,
           filters:{ min_assessment_score:D.minScore, only_available:D.onlyAvail }, sort:D.sort, skill_overrides:{ added:D.add, removed:D.rm } };
}
function matchRes(need, list) {
  const f = x => +x.toFixed(2);
  return { request_id:D.reqId,
    need_analysis:{ category:need.track, category_label:TRACKS[need.track].name, confidence:f(need.conf), required_skills:need.tags, matched_keywords:need.kws,
                    urgency:need.urgent ? 'high' : 'normal', complexity:need.complexity, fair_fee_range_idr:need.fee, budget_below_fair_range:D.budget < need.fee[0] },
    weights:{ skill_fit:W.skill, assessment:W.assess, budget_fit:W.budget, reliability:W.rel },
    total_candidates:list.length,
    candidates:list.slice(0, 3).map((r, i) => ({ rank:i + 1, talent_id:r.c.id, name:r.c.name, match_score:r.total,
      breakdown:{ skill_fit:f(r.skill), assessment:f(r.assess), budget_fit:f(r.budget), reliability:f(r.rel) },
      matched_skills:r.have, missing_skills:r.miss,
      verified_assessment:{ track:r.c.track, score:r.c.assessment.score, level:r.c.assessment.level, session_id:r.c.assessment.session },
      reasons:r.why, warnings:r.warn })) };
}

function showAssess(id) {
  const c = CANDS.find(x => x.id === id), a = c.assessment, tr = TRACKS[c.track];
  openModal(`<div class="flex items-start gap-4 pr-8">${avatar(c)}<div class="min-w-0 flex-1"><h2 class="text-lg font-bold text-navy-950">${esc(c.name)}</h2><p class="text-sm text-slate-500">${tr.name} · ${esc(c.city)}</p></div>${ring(a.score, '#059669')}</div>
    <dl class="mt-5 grid grid-cols-3 gap-2">${[['Level', a.level], ['Format', TEST_LEN + ' soal adaptif'], ['Tanggal', fmtDate(a.date)]].map(([l, v]) => `<div class="rounded-xl bg-slate-50 p-3"><dt class="text-xs text-slate-500">${l}</dt><dd class="mt-0.5 text-sm font-bold text-navy-950">${v}</dd></div>`).join('')}</dl>
    <h3 class="mt-6 text-sm font-bold text-navy-950">Skor per kompetensi</h3>
    <div class="mt-3 space-y-3">${tr.comps.map(k => { const v = a.comps[k]; return `<div><div class="flex justify-between text-sm"><span class="text-slate-600">${k}</span><b class="${v == null ? 'font-semibold text-slate-400' : 'text-navy-950'}">${v == null ? 'Belum diuji' : v + '%'}</b></div><div class="mt-1.5">${bar(v || 0, 'bg-emerald-500')}</div></div>`; }).join('')}</div>
    <p class="mt-5 rounded-xl bg-slate-50 p-3 text-xs leading-relaxed text-slate-500">ID sesi <span class="font-mono text-navy-900">${a.session}</span>. Hasil asesmen tidak bisa diubah oleh talenta dan dikalibrasi ulang dengan rating proyek nyata.</p>
    <div class="mt-5 flex justify-end"><button class="${btn('pri')}" onclick="closeModal();invite('${c.id}')">${ic('send','h-4 w-4')} Undang ke proyek</button></div>`, 'Hasil asesmen ' + c.name);
}

function invite(id) {
  const c = CANDS.find(x => x.id === id), dp = Math.round(D.budget * .3 / 1000) * 1000;
  const title = D.desc.trim().split(/[.!?]/)[0].slice(0, 70) || 'Proyek baru';
  openModal(`<h2 class="pr-8 text-lg font-bold text-navy-950">Undang ${esc(first(c.name))} ke proyek</h2><p class="mt-1 text-sm text-slate-500">Undangan berisi draf kontrak. Dana baru ditahan setelah talenta menerima.</p>
    <label class="mt-5 block"><span class="mb-1.5 block text-sm font-semibold text-navy-900">Judul proyek</span><input id="invTitle" class="${INP}" value="${esc(title)}"></label>
    <dl class="mt-4 divide-y divide-slate-100 rounded-xl border border-slate-200 text-sm">${[['Honor total', rp(D.budget)], ['DP cair ke talenta (30%)', rp(dp)], ['Ditahan sampai hasil diterima', rp(D.budget - dp)], ['Tenggat', D.days + ' hari'], ['Kuota revisi', '2 kali']].map(([l, v]) => `<div class="flex justify-between px-4 py-2.5"><dt class="text-slate-600">${l}</dt><dd class="font-bold tabular-nums text-navy-950">${v}</dd></div>`).join('')}</dl>
    ${c.rate > D.budget ? `<p class="mt-3 flex gap-2 rounded-xl bg-amber-50 p-3 text-sm text-amber-800"><span class="shrink-0 text-amber-600">${ic('alert','h-4 w-4')}</span>Tarif minimum ${esc(first(c.name))} ${rp(c.rate)}, di atas budget. Undangan tetap bisa dikirim dan talenta boleh mengajukan penawaran balik.</p>` : ''}
    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button class="${btn('ghost')}" onclick="closeModal()">Batal</button><button class="${btn('acc')}" onclick="sendInvite('${c.id}')">${ic('send','h-4 w-4')} Kirim undangan</button></div>`, 'Undang talenta');
}

/* =====================================================================
   11b. RUANG PROYEK: undangan → escrow → progres → revisi → selesai
   Satu pengguna demo memerankan dua sisi lewat tombol "Tampilan".
   [PRODUKSI] status proyek, saldo escrow, dan kuota revisi dikelola backend.
   ===================================================================== */
let P = null;
const P_STATUS = { invited:['Menunggu talenta','bg-amber-50 text-amber-800 ring-amber-200'], escrow:['Menunggu pembayaran','bg-amber-50 text-amber-800 ring-amber-200'],
  working:['Dikerjakan','bg-sky-50 text-sky-700 ring-sky-200'], submitted:['Menunggu persetujuan klien','bg-sky-50 text-sky-700 ring-sky-200'], done:['Selesai','bg-emerald-50 text-emerald-700 ring-emerald-200'] };
const P_ACTOR = { invited:'talent', escrow:'client', working:'talent', submitted:'client', done:'client' };
const P_NEXT = { invited:'Talenta perlu menerima undangan.', escrow:'Klien perlu membayar ke escrow.', working:'Talenta mengirim update progres.', submitted:'Klien meninjau hasil: terima, atau klaim revisi.', done:'Klien bisa memberi rating.' };
const pSay = (from, t) => P.chat.push({ from, t });
const pTalent = () => CANDS.find(x => x.id === P.talentId) || { name:'Talenta', track:'frontend', city:'', av:0, assessment:{ score:0, level:'' } };

function sendInvite(id) {
  const c = CANDS.find(x => x.id === id);
  const title = ($('#invTitle')?.value || '').trim() || 'Proyek baru';
  const dp = Math.round(D.budget * .3 / 1000) * 1000;
  P = { talentId:id, title, fee:D.budget, dp, days:D.days, maxRev:2, revUsed:0, revOpen:null, prog:0, day:0, log:[], status:'invited', view:'talent', rating:0, report:null,
        chat:[{ from:'sys', t:`Klien mengirim undangan proyek ke ${c.name}.` }] };
  closeModal(); nav('proyek'); toast('Undangan terkirim. Sekarang lihat dari sisi talenta.');
}
function pView(v) { P.view = v; render(); }
function pAccept() { P.status = 'escrow'; P.view = 'client'; pSay('sys', 'Talenta menerima undangan. Menunggu klien membayar ke escrow.'); render(); toast('Undangan diterima.'); }
function pDecline() { P = null; nav('dashboard'); toast('Undangan ditolak. Klien bisa mengundang kandidat lain.'); }
function pPay() { P.status = 'working'; P.view = 'talent'; pSay('sys', `Dana ${rp(P.fee)} ditahan di escrow. DP ${rp(P.dp)} cair ke talenta.`); render(); toast('Dana masuk escrow. DP cair ke talenta.'); }
function pUpdate() {
  const p = +$('#pRange').value, n = $('#pNote').value.trim();
  if (p < P.prog) return toast('Progres tidak bisa lebih kecil dari update sebelumnya.');
  P.log.unshift({ p, n, d:P.day }); P.prog = p;
  if (p === 100 && !P.revOpen) { P.status = 'submitted'; P.view = 'client'; pSay('sys', 'Talenta mengirim hasil akhir.'); }
  render(); toast(p === 100 ? 'Hasil akhir terkirim ke klien.' : 'Progres diperbarui.');
}
function pClaimRev() {
  const n = $('#pRev').value.trim(); if (!n) return toast('Tulis apa yang perlu direvisi.');
  P.revUsed++; P.revOpen = n; P.status = 'working'; P.view = 'talent';
  pSay('sys', `Revisi ke-${P.revUsed} dari ${P.maxRev} diajukan: ${n}`); render(); toast('Revisi diajukan.');
}
function pRevDone() { P.revOpen = null; P.status = P.prog === 100 ? 'submitted' : 'working'; if (P.status === 'submitted') P.view = 'client'; pSay('sys', 'Talenta menandai revisi selesai.'); render(); }
function pAcceptResult() { P.status = 'done'; pSay('sys', `Hasil diterima. Sisa dana ${rp(P.fee - P.dp)} cair ke talenta.`); render(); toast('Proyek selesai. Sisa dana cair ke talenta.'); }
function pRate(n) {
  if (P.rating) return; P.rating = n;
  const c = CANDS.find(x => x.id === P.talentId);
  if (c) { const onTime = P.day <= P.days ? 100 : 0; c.onTime = c.projects ? Math.round((c.onTime * c.projects + onTime) / (c.projects + 1)) : onTime; c.projects++; }
  pSay('sys', `Klien memberi rating ${n} dari 5.`); render(); toast('Rating tersimpan dan masuk ke reliabilitas talenta.');
}
function pSend() { const v = $('#pMsg').value.trim(); if (!v) return; pSay(P.view, v); render(); $('#pMsg')?.focus(); }

const P_REASONS = { client:['Hasil jauh di bawah level asesmen', 'Talenta tidak merespons', 'Melewati tenggat tanpa kabar', 'Lainnya'],
  talent:['Klien meminta pekerjaan di luar kontrak', 'Klien tidak merespons', 'Klien meminta revisi di luar kuota', 'Lainnya'] };
function pReport() {
  const cl = P.view === 'client';
  openModal(`<h2 class="pr-8 text-lg font-bold text-navy-950">Laporkan ${cl ? 'talenta' : 'klien'}</h2><p class="mt-1 text-sm text-slate-500">Laporan ditinjau admin. Selama ditinjau, dana di escrow tetap ditahan.</p>
    <label class="mt-5 block"><span class="mb-1.5 block text-sm font-semibold text-navy-900">Alasan</span><select id="repReason" class="${INP}">${P_REASONS[P.view].map(r => `<option>${r}</option>`).join('')}</select></label>
    <label class="mt-4 block"><span class="mb-1.5 block text-sm font-semibold text-navy-900">Jelaskan masalahnya</span><textarea id="repNote" rows="3" class="${INP}" placeholder="Ceritakan apa yang terjadi dan kapan"></textarea></label>
    <div class="mt-6 flex flex-col-reverse gap-2 sm:flex-row sm:justify-end"><button class="${btn('ghost')}" onclick="closeModal()">Batal</button><button class="${btn('pri')}" onclick="pReportSend()">${ic('alert','h-4 w-4')} Kirim laporan</button></div>`, 'Laporkan');
}
function pReportSend() {
  const note = $('#repNote').value.trim(); if (!note) return toast('Jelaskan masalahnya dulu.');
  P.report = { by:P.view, reason:$('#repReason').value, note, day:P.day, resolved:false };
  pSay('sys', `${P.view === 'client' ? 'Klien' : 'Talenta'} mengirim laporan: ${P.report.reason}. Admin sedang meninjau.`);
  closeModal(); render(); toast('Laporan terkirim ke admin.');
}
function pReportResolve() { P.report.resolved = true; pSay('sys', 'Admin selesai meninjau laporan. Proyek dilanjutkan.'); render(); toast('Laporan ditutup oleh admin.'); }

function viewProject() {
  if (!P) return `<div class="mx-auto max-w-3xl px-4 py-20 text-center sm:px-6"><span class="mx-auto grid h-12 w-12 place-items-center rounded-xl bg-navy-50 text-navy-700">${ic('clipboard')}</span><h1 class="mt-5 text-2xl font-extrabold text-navy-950">Belum ada proyek berjalan</h1><p class="mt-2 text-slate-600">Ruang proyek terbuka setelah klien mengundang kandidat dari Dashboard Klien.</p><button class="${btn('pri')} mt-6" onclick="nav('dashboard')">Buka Dashboard Klien ${ic('arrowR','h-4 w-4')}</button></div>`;
  const c = pTalent(), cl = P.view === 'client', st = P.status, rest = P.fee - P.dp, fin = st === 'done';
  const paid = st !== 'invited' && st !== 'escrow', run = st === 'working' || st === 'submitted', over = P.day > P.days, left = P.maxRev - P.revUsed;
  const repOpen = !!P.report && !P.report.resolved;
  const stepNow = { invited:1, escrow:2, working:3, submitted:3, done:5 }[st];
  const steps = ['Undangan', 'Escrow', 'Pengerjaan', 'Selesai'].map((s, i) => { const n = i + 1, done = n < stepNow, on = n === stepNow;
    return `<li class="flex ${n < 4 ? 'flex-1' : ''} items-center gap-2"><span class="grid h-7 w-7 shrink-0 place-items-center rounded-full text-xs font-bold ${done ? 'bg-emerald-600 text-white' : on ? 'bg-navy-900 text-white' : 'bg-slate-200 text-slate-500'}">${done ? ic('check','h-3.5 w-3.5') : n}</span><span class="hidden whitespace-nowrap text-sm font-semibold sm:block ${on ? 'text-navy-900' : 'text-slate-500'}">${s}</span>${n < 4 ? `<span class="h-px flex-1 ${done ? 'bg-emerald-300' : 'bg-slate-200'}"></span>` : ''}</li>`; }).join('');
  const tile = (l, v, strong) => `<div class="rounded-xl ${strong ? 'bg-navy-900 text-white' : 'bg-slate-50'} p-3"><p class="text-xs ${strong ? 'text-slate-300' : 'text-slate-500'}">${l}</p><p class="mt-0.5 text-lg font-extrabold tabular-nums ${strong ? '' : 'text-navy-950'}">${v}</p></div>`;
  const wait = t => `<div class="${CARD} flex items-center gap-3 p-5"><span class="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-slate-100 text-slate-500">${ic('clock')}</span><p class="text-sm text-slate-600">${t}</p></div>`;
  const kontrak = [['Honor total', rp(P.fee)], ['DP ke talenta (30%)', rp(P.dp)], ['Sisa setelah hasil diterima', rp(rest)], ['Tenggat', P.days + ' hari'], ['Kuota revisi', P.maxRev + ' kali']];
  let main = '';

  if (st === 'invited') main = cl ? wait(`Undangan sudah dikirim ke ${esc(first(c.name))}. Dana belum ditahan sampai talenta menerima.`)
    : `<div class="${CARD} p-6"><h2 class="text-lg font-bold text-navy-950">Undangan proyek untukmu</h2><p class="mt-1 text-sm text-slate-600">Klien memilihmu dari hasil Smart Matching. Baca draf kontrak di samping, lalu terima atau tolak.</p>
        <ul class="mt-4 space-y-2 text-sm text-slate-600">${['DP 30% cair begitu klien membayar ke escrow, sebagai modal kerja.', 'Sisa honor ditahan Rintisa dan cair setelah hasil diterima.', `Revisi dibatasi ${P.maxRev} kali sesuai kontrak.`].map(checkLi).join('')}</ul>
        <div class="mt-6 flex flex-col gap-2 sm:flex-row"><button class="${btn('acc')}" onclick="pAccept()">${ic('check','h-4 w-4')} Terima undangan</button><button class="${btn('out')}" onclick="pDecline()">Tolak</button></div></div>`;

  if (st === 'escrow') main = cl ? `<div class="${CARD} p-6"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-navy-50 text-navy-700">${ic('lock')}</span><h2 class="text-lg font-bold text-navy-950">Bayar ke escrow</h2></div>
        <p class="mt-3 text-sm text-slate-600">Seluruh honor ${rp(P.fee)} ditahan Rintisa. DP ${rp(P.dp)} langsung cair ke talenta, dan sisanya ${rp(rest)} baru cair setelah kamu menerima hasil.</p>
        <button class="${btn('acc')} mt-5" onclick="pPay()">${ic('wallet','h-4 w-4')} Bayar ${rp(P.fee)} ke escrow</button><p class="mt-2 text-xs text-slate-500">Simulasi: tidak ada uang yang benar-benar berpindah.</p></div>`
    : wait('Undangan sudah kamu terima. Menunggu klien membayar ke escrow sebelum pekerjaan dimulai.');

  if (run || fin) {
    main = `<div class="${CARD} p-6"><div class="flex items-center justify-between gap-3"><h2 class="text-lg font-bold text-navy-950">Progres pekerjaan</h2>${fin ? '' : `<button class="${btn('ghost','sm')}" onclick="P.day++;render()">${ic('clock','h-4 w-4')} Simulasi: maju 1 hari</button>`}</div>
        <p class="mt-4 text-xs font-semibold text-slate-500">Waktu: hari ke-${P.day} dari ${P.days}${over ? ' <span class="text-rose-600">(lewat tenggat)</span>' : ''}</p><div class="mt-1.5">${bar(P.day / P.days * 100, over ? 'bg-rose-500' : 'bg-amber-400')}</div>
        <p class="mt-4 text-xs font-semibold text-slate-500">Pekerjaan: ${P.prog}% selesai</p><div class="mt-1.5">${bar(P.prog, 'bg-emerald-500')}</div>
        ${P.log.length ? `<ol class="mt-5 space-y-3 border-l-2 border-slate-200 pl-4">${P.log.map(l => `<li class="text-sm"><b class="text-navy-950">${l.p}%</b> <span class="text-xs text-slate-500">· hari ke-${l.d}</span><br><span class="text-slate-600">${esc(l.n || 'Tanpa catatan')}</span></li>`).join('')}</ol>` : '<p class="mt-5 text-sm text-slate-500">Belum ada update dari talenta.</p>'}</div>`;

    if (!cl && st === 'working') main += `<div class="${CARD} mt-4 p-6"><h2 class="text-lg font-bold text-navy-950">Kirim update</h2>
        ${P.revOpen ? `<div class="mt-3 rounded-xl border border-amber-200 bg-amber-50 p-4 text-sm text-amber-900"><b>Revisi ke-${P.revUsed}:</b> ${esc(P.revOpen)}<br><button class="${btn('acc','sm')} mt-3" onclick="pRevDone()">${ic('check','h-4 w-4')} Tandai revisi selesai</button></div>` : ''}
        <label class="mt-4 block"><span class="flex justify-between text-sm font-semibold text-navy-900">Persentase selesai <output id="pOut" class="tabular-nums">${P.prog}%</output></span><input id="pRange" type="range" min="0" max="100" step="5" value="${P.prog}" class="mt-2 w-full accent-emerald-600" oninput="$('#pOut').textContent=this.value+'%'"></label>
        <label class="mt-4 block"><span class="mb-1.5 block text-sm font-semibold text-navy-900">Catatan</span><input id="pNote" class="${INP}" placeholder="Contoh: halaman menu selesai, lanjut tombol WhatsApp"></label>
        <button class="${btn('pri')} mt-4" onclick="pUpdate()">${ic('send','h-4 w-4')} Kirim update</button><p class="mt-2 text-xs text-slate-500">Update 100% dikirim sebagai hasil akhir.</p></div>`;
    if (!cl && st === 'submitted') main += `<div class="mt-4">${wait('Hasil akhir sudah dikirim. Menunggu klien menerima hasil atau mengklaim revisi.')}</div>`;

    const can = cl && !fin && left > 0 && P.prog > 0 && !P.revOpen;
    main += `<div class="${CARD} mt-4 p-6"><h2 class="text-lg font-bold text-navy-950">Revisi</h2>
        <div class="mt-3 flex items-center gap-2" role="img" aria-label="Revisi terpakai ${P.revUsed} dari ${P.maxRev}">${Array.from({ length:P.maxRev }, (_, i) => `<span class="grid h-7 w-7 place-items-center rounded-full border-2 border-navy-900 ${i < P.revUsed ? 'bg-navy-900 text-white' : ''}">${i < P.revUsed ? ic('check','h-3.5 w-3.5') : ''}</span>`).join('')}<span class="ml-1 text-sm text-slate-600">Terpakai ${P.revUsed} dari ${P.maxRev} sesuai kontrak</span></div>
        ${cl && !fin ? `<textarea id="pRev" rows="2" class="${INP} mt-4" placeholder="Apa yang perlu direvisi?" ${can ? '' : 'disabled'}></textarea>
          <button class="${btn('out','sm')} mt-3" ${can ? '' : 'disabled'} onclick="pClaimRev()">${ic('refresh','h-4 w-4')} Klaim revisi</button>
          <p class="mt-2 text-xs text-slate-500">${left <= 0 ? `${ic('lock','inline h-3.5 w-3.5')} Kuota habis, tombol revisi terkunci otomatis.` : P.revOpen ? 'Menunggu talenta menyelesaikan revisi sebelumnya.' : !P.prog ? 'Revisi bisa diklaim setelah ada progres.' : `Sisa kuota: ${left} kali.`}</p>` : ''}</div>`;

    if (cl && !fin) main += `<div class="${CARD} mt-4 p-6"><h2 class="text-lg font-bold text-navy-950">Terima hasil</h2><p class="mt-1 text-sm text-slate-600">Sisa dana ${rp(rest)} cair ke talenta setelah hasil diterima.</p>
        <button class="${btn('acc')} mt-4" ${st === 'submitted' && !P.revOpen && !repOpen ? '' : 'disabled'} onclick="pAcceptResult()">${ic('check','h-4 w-4')} Terima hasil & cairkan sisa dana</button>
        ${repOpen ? '<p class="mt-2 text-xs text-amber-700">Pencairan dikunci selama laporan ditinjau admin.</p>' : st === 'submitted' ? '' : '<p class="mt-2 text-xs text-slate-500">Tombol aktif setelah talenta mengirim hasil akhir (100%) dan tidak ada revisi yang menggantung.</p>'}</div>`;

    if (fin) main = `<div class="rounded-2xl border border-emerald-200 bg-emerald-50 p-6"><div class="flex items-center gap-3"><span class="grid h-10 w-10 place-items-center rounded-xl bg-emerald-600 text-white">${ic('shieldCheck')}</span><div><h2 class="text-lg font-bold text-navy-950">Proyek selesai</h2><p class="text-sm text-slate-600">Seluruh honor ${rp(P.fee)} sudah cair ke talenta${over ? ', dengan catatan melewati tenggat' : ''}.</p></div></div>
        ${cl ? `<p class="mt-5 text-sm font-semibold text-navy-900">${P.rating ? 'Rating kamu' : 'Beri rating untuk ' + esc(first(c.name))}</p><div class="mt-2 flex gap-1">${[1,2,3,4,5].map(n => `<button onclick="pRate(${n})" aria-label="${n} bintang" ${P.rating ? 'disabled' : ''} class="grid h-10 w-10 place-items-center rounded-lg text-2xl transition ${n <= P.rating ? 'text-amber-500' : 'text-slate-300 hover:text-amber-400'}">★</button>`).join('')}</div><p class="mt-2 text-xs text-slate-500">Rating dan ketepatan waktu masuk ke faktor reliabilitas talenta di Match Score.</p>`
              : `<p class="mt-4 text-sm text-slate-600">${P.rating ? `Klien memberi rating ${P.rating} dari 5.` : 'Menunggu rating dari klien.'} Proyek ini tercatat sebagai pengalaman terverifikasi pertamamu.</p>`}</div><div class="mt-4">` + main + '</div>';
  }

  return `<div class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
    <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
      <div class="min-w-0">${eyebrow('Ruang proyek')}<h1 class="mt-1 text-3xl font-extrabold tracking-tight text-navy-950">${esc(P.title)}</h1>
        <p class="mt-2 flex flex-wrap items-center gap-2 text-sm text-slate-600"><span class="rounded-full px-2.5 py-0.5 text-xs font-bold ring-1 ${P_STATUS[st][1]}">${P_STATUS[st][0]}</span><span>Talenta: <b class="text-navy-900">${esc(c.name)}</b></span></p></div>
      <div><p class="mb-1.5 text-xs font-semibold text-slate-500 md:text-right">Tampilan</p><div class="inline-flex rounded-xl bg-white p-1 shadow-soft ring-1 ring-slate-200" role="tablist" aria-label="Pilih peran">${[['client','Klien'],['talent','Talenta']].map(([k, l]) => `<button role="tab" aria-selected="${P.view === k}" onclick="pView('${k}')" class="rounded-lg px-4 py-2 text-sm font-semibold transition ${P.view === k ? 'bg-navy-900 text-white shadow-sm' : 'text-slate-600 hover:text-navy-900'}">${l}</button>`).join('')}</div></div>
    </div>
    <div class="${CARD} mt-6 p-4"><ol class="flex items-center gap-2 sm:gap-3">${steps}</ol></div>
    ${P_ACTOR[st] !== P.view && !(st === 'done' && P.rating) ? `<div class="mt-4 flex flex-col items-start justify-between gap-3 rounded-2xl border border-navy-100 bg-navy-50/70 p-4 sm:flex-row sm:items-center"><p class="text-sm text-navy-900"><b>Langkah berikutnya:</b> ${P_NEXT[st]}</p><button class="${btn('pri','sm')}" onclick="pView('${P_ACTOR[st]}')">Beralih ke tampilan ${P_ACTOR[st] === 'client' ? 'Klien' : 'Talenta'} ${ic('arrowR','h-4 w-4')}</button></div>` : ''}
    ${P.report ? (repOpen ? `<div class="mt-4 rounded-2xl border border-amber-200 bg-amber-50 p-4"><div class="flex gap-3"><span class="shrink-0 text-amber-600">${ic('alert')}</span><div class="min-w-0 flex-1"><p class="font-bold text-amber-900">Laporan sedang ditinjau admin</p><p class="mt-1 text-sm text-amber-800">Dari ${P.report.by === 'client' ? 'klien' : 'talenta'} pada hari ke-${P.report.day}: <b>${esc(P.report.reason)}</b>. ${esc(P.report.note)}</p><p class="mt-1 text-sm text-amber-800">Dana di escrow tetap ditahan sampai ada keputusan.</p><button class="${btn('out','sm')} mt-3" onclick="pReportResolve()">Simulasi: admin menutup laporan</button></div></div></div>` : `<p class="mt-4 flex items-center gap-2 rounded-xl bg-slate-100 px-4 py-2.5 text-sm text-slate-600">${ic('check','h-4 w-4 text-emerald-600')} Laporan "${esc(P.report.reason)}" sudah ditinjau dan ditutup admin.</p>`) : ''}
    <div class="mt-6 grid gap-6 lg:grid-cols-[1fr_340px]">
      <div class="min-w-0">${main}</div>
      <aside class="space-y-4">
        <div class="${CARD} p-5"><h3 class="flex items-center gap-2 text-sm font-bold text-navy-950">${ic('lock','h-4 w-4')} Escrow</h3>
          <div class="mt-3 grid gap-2">${tile('Ditahan Rintisa', rp(paid && !fin ? rest : 0), true)}${tile('DP cair ke talenta', rp(paid ? P.dp : 0))}${tile('Sisa cair ke talenta', rp(fin ? rest : 0))}</div>
          <p class="mt-3 text-xs text-slate-500">${!paid ? 'Dana belum dibayar ke escrow.' : fin ? 'Semua dana sudah dicairkan.' : 'Sisa dana aman sampai hasil diterima klien.'}</p></div>
        <div class="${CARD} p-5"><h3 class="text-sm font-bold text-navy-950">Kontrak</h3><dl class="mt-3 divide-y divide-slate-100 text-sm">${kontrak.map(([l, v]) => `<div class="flex justify-between py-2"><dt class="text-slate-600">${l}</dt><dd class="font-bold tabular-nums text-navy-950">${v}</dd></div>`).join('')}</dl></div>
        <div class="${CARD} p-5"><h3 class="flex items-center gap-2 text-sm font-bold text-navy-950">${ic('chat','h-4 w-4')} Chat proyek</h3>
          <div id="pChat" class="mt-3 flex max-h-64 flex-col gap-2 overflow-y-auto">${P.chat.map(m => m.from === 'sys' ? `<p class="px-2 text-center text-xs text-slate-500">${esc(m.t)}</p>` : `<p class="max-w-[85%] rounded-2xl px-3 py-2 text-sm ${m.from === P.view ? 'self-end bg-navy-900 text-white' : 'self-start bg-slate-100 text-slate-700'}">${esc(m.t)}</p>`).join('')}</div>
          <div class="mt-3 flex gap-2"><input id="pMsg" class="${INP}" placeholder="Tulis pesan sebagai ${cl ? 'klien' : 'talenta'}" onkeydown="if(event.key==='Enter')pSend()"><button class="${btn('pri','sm')}" onclick="pSend()" aria-label="Kirim pesan">${ic('send','h-4 w-4')}</button></div></div>
        ${st !== 'invited' ? `<div class="${CARD} p-5"><h3 class="text-sm font-bold text-navy-950">Ada masalah?</h3><p class="mt-1 text-xs text-slate-500">Laporkan ke admin jika pihak lain melanggar kontrak. Dana ditahan selama laporan ditinjau.</p><button class="${btn('out','sm')} mt-3 w-full" ${P.report ? 'disabled' : ''} onclick="pReport()">${ic('alert','h-4 w-4')} ${P.report ? 'Laporan sudah dikirim' : 'Laporkan ' + (cl ? 'talenta' : 'klien')}</button></div>` : ''}
      </aside>
    </div>
  </div>`;
}

/* ---------- 12. Global ---------- */
function resetDemo() {
  try { localStorage.removeItem(LS); } catch (e) {}
  stopTimer(); clearTimeout(T.match);
  CANDS = BASE.map(c => ({ ...c })); Object.assign(A, freshA()); Object.assign(D, freshD()); P = null;
  if (route() === 'proyek') location.hash = '#/dashboard';
  render(); toast('Demo direset ke kondisi awal.');
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && $('#modal').innerHTML) { closeModal(); return; }
  if ($('#modal').innerHTML || route() !== 'onboarding' || A.step !== 3 || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const m = { '1':0, '2':1, '3':2, '4':3, a:0, b:1, c:2, d:3 }[e.key.toLowerCase()];
  if (m != null) { A.sel = A.order[m]; render(); }
  else if (e.key === 'Enter' && A.sel != null) { e.preventDefault(); submitAns(false); }
});
render();
</script>
</body>
</html>
